# Netlify 配置（全规则服务器官网）

# 把 /sb/* 路由到反向代理 Edge Function（netlify/edge-functions/sb.js）
[[edge_functions]]
  function = "sb"
  path = "/sb/*"

# 启动器下载保护：/downloads/* 先经过 protect-download 校验登录，未登录直接 403
[[edge_functions]]
  function = "protect-download"
  path = "/downloads/*"

# 图片等静态资源长期缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 启动器下载：保留较短缓存，方便以后更新本体
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# 基础安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
